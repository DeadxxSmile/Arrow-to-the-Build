name: Build 2.1.7 hotfix test artifacts

on:
  push:
    paths:
      - '.github/workflows/build-hotfix-2.1.7.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set hotfix test version
        shell: pwsh
        run: npm version 2.1.7 --no-git-tag-version

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --include=dev

      - name: Run regression suite
        shell: pwsh
        run: npm test

      - name: Build renderer
        shell: pwsh
        run: npm run build:renderer

      - name: Build Windows installer
        shell: pwsh
        run: npx electron-builder --win nsis

      - name: Create source ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'artifact-source\Arrow-to-the-Build'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          git ls-files | ForEach-Object {
            $source = Join-Path $PWD $_
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              $destination = Join-Path $stage $_
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
              Copy-Item -LiteralPath $source -Destination $destination -Force
            }
          }
          Copy-Item -LiteralPath 'package.json' -Destination (Join-Path $stage 'package.json') -Force
          Copy-Item -LiteralPath 'package-lock.json' -Destination (Join-Path $stage 'package-lock.json') -Force
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath 'Arrow-to-the-Build_v2.1.7-hotfix.zip' -CompressionLevel Optimal

      - name: Upload hotfix artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ATTB-2.1.7-hotfix-test
          if-no-files-found: error
          retention-days: 7
          path: |
            Arrow-to-the-Build_v2.1.7-hotfix.zip
            dist/ATTB-Setup-2.1.7.exe
