name: Build 2.1.7 hotfix test artifacts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set hotfix test version
        shell: pwsh
        run: npm version 2.1.7 --no-git-tag-version

      - name: Align hotfix metadata
        shell: pwsh
        run: |
          function Replace-InFile([string]$Path, [string]$Old, [string]$New) {
            $text = Get-Content -LiteralPath $Path -Raw
            $text = $text.Replace($Old, $New)
            Set-Content -LiteralPath $Path -Value $text -NoNewline
          }

          Replace-InFile 'tests/addonIntegration.test.js' '1.1.0' '1.1.1'
          Replace-InFile 'tests/addonIntegration.test.js' '1\.1\.0' '1\.1\.1'
          Replace-InFile 'tests/packaging.test.js' '1.1.0' '1.1.1'
          Replace-InFile 'tests/packaging.test.js' '1\.1\.0' '1\.1\.1'
          Replace-InFile 'tests/packaging.test.js' '10100' '10101'
          Replace-InFile 'tests/releaseConsistency.test.js' "'1.1.0'" "'1.1.1'"
          Replace-InFile 'tests/releaseConsistency.test.js' "'10100'" "'10101'"

          $readme = Get-Content -LiteralPath 'README.md' -Raw
          $readme = $readme.Replace('**v2.1.6**', '**v2.1.7**')
          if ($readme -notmatch '\*\*v2\.1\.7\*\*') {
            $needle = '> **I Used To Be Meta Like You, Then I Took An Arrow To The Build**'
            $readme = $readme.Replace($needle, "$needle`r`n`r`nCurrent hotfix test build: **v2.1.7**")
          }
          Set-Content -LiteralPath 'README.md' -Value $readme -NoNewline

          Replace-InFile 'docs/index.html' 'v2.1.6' 'v2.1.7'

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --include=dev

      - name: Run regression suite
        shell: pwsh
        run: npm test

      - name: Build renderer
        shell: pwsh
        run: npm run build:renderer

      - name: Build Windows installer
        shell: pwsh
        run: npx electron-builder --win nsis

      - name: Create source ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'artifact-source\Arrow-to-the-Build'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          git ls-files | ForEach-Object {
            $source = Join-Path $PWD $_
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              $destination = Join-Path $stage $_
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
              Copy-Item -LiteralPath $source -Destination $destination -Force
            }
          }
          Copy-Item -LiteralPath 'package.json' -Destination (Join-Path $stage 'package.json') -Force
          Copy-Item -LiteralPath 'package-lock.json' -Destination (Join-Path $stage 'package-lock.json') -Force
          Copy-Item -LiteralPath 'README.md' -Destination (Join-Path $stage 'README.md') -Force
          Copy-Item -LiteralPath 'docs/index.html' -Destination (Join-Path $stage 'docs/index.html') -Force
          Copy-Item -LiteralPath 'tests/addonIntegration.test.js' -Destination (Join-Path $stage 'tests/addonIntegration.test.js') -Force
          Copy-Item -LiteralPath 'tests/packaging.test.js' -Destination (Join-Path $stage 'tests/packaging.test.js') -Force
          Copy-Item -LiteralPath 'tests/releaseConsistency.test.js' -Destination (Join-Path $stage 'tests/releaseConsistency.test.js') -Force
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath 'Arrow-to-the-Build_v2.1.7-hotfix.zip' -CompressionLevel Optimal

      - name: Upload hotfix artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ATTB-2.1.7-hotfix-test
          if-no-files-found: error
          retention-days: 7
          path: |
            Arrow-to-the-Build_v2.1.7-hotfix.zip
            dist/ATTB-Setup-2.1.7.exe
